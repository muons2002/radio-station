<head>
  <meta charset="utf-8">

  <meta name="color-scheme" content="dark">
  <meta property="og:title" content="مباريات اليوم">
  <meta property="og:description" content="مباريات اليوم مباشرة — المواعيد والنتائج بتوقيت القاهرة">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:,">
  <title>مباريات اليوم</title>
  <style>
    * { box-sizing: border-box; }
    :root{
      --bg:#0b1220;
      --card:#121c2e;
      --border:#29364c;
      --border-strong:#354158;
      --text:#eef2ff;
      --muted:#a6b0c3;
      --live:#62e6a7;
    }
    body {
      margin: 0; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 760px; margin: auto; }
    header { margin-bottom: 22px; }
    h1 { margin: 0 0 6px; font-size: 28px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em; }
    .muted { color: var(--muted); font-size: 15px; }
    .brand { margin-top: 8px; color: #2fb9d8; font-size: 17px; font-weight: 700; }
    .brand span { color: var(--muted); font-size: 14px; font-weight: 500; margin-inline-start: 6px; }
    .days { display: flex; gap: 8px; margin: 20px 0 4px; }
    .day {
      flex: 1 1 0; min-width: 0; min-height: 54px; padding: 8px 4px; border-radius: 10px;
      border: 1px solid var(--border-strong); background: var(--card); color: var(--text);
      font: inherit; cursor: pointer; text-align: center; line-height: 1.25;
    }
    .day .dname { display: block; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; }
    .day .ddate { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
    .day.active { background: #2fb9d8; border-color: #2fb9d8; color: #06222c; }
    .day.active .ddate { color: #0d3d4b; }
    .day:focus-visible { outline: 2px solid #2fb9d8; outline-offset: 2px; }
    .controls { display: flex; gap: 10px; margin: 14px 0 6px; }
    input, select {
      min-width: 0; padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--border-strong); background: var(--card); color: var(--text);
      font: inherit; font-size: 15px; min-height: 48px;
    }
    input { flex: 1; }
    input::placeholder{ color: #7e8aa0; }
    input:focus, select:focus{ outline: 2px solid #2fb9d8; outline-offset: 1px; border-color: transparent; }
    select{ cursor: pointer; min-width: 148px; }
    .match {
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; gap: 12px; padding: 18px;
      margin: 12px 0; border: 1px solid var(--border);
      border-radius: 14px; background: var(--card);
    }
    .league { grid-column: 1 / -1; text-align: center; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: -2px; }
    .team{ display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 17px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
    .team:last-child { justify-content: flex-end; }
    .team img{ width: 24px; height: 24px; object-fit: contain; flex: none; }
    .score { font-size: 20px; font-weight: 700; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .status { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
    .status.live { color: var(--live); }
    .dot{ width: 7px; height: 7px; border-radius: 999px; background: currentColor; display: none; }
    .status.live .dot{ display: inline-block; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
    @media (prefers-reduced-motion: reduce){ .status.live .dot{ animation: none; } }
    .empty{
      text-align: center; padding: 36px 16px; border: 1px dashed var(--border-strong);
      border-radius: 14px; color: var(--muted); margin-top: 12px; font-size: 15px;
    }
    @media (max-width: 480px) {
      body { padding: 16px; }
      h1{ font-size: 25px; }
      .days { flex-wrap: wrap; }
      .day { flex: 1 1 30%; }
      .controls { flex-direction: column; }
      select{ width: 100%; }
      .match { padding: 16px 12px; gap: 8px; }
      .team{ font-size: 16px; }
      .score{ font-size: 19px; }
    }
  </style>
</head>

  <header>
    <h1>⚽ مباريات اليوم</h1>
    <div class="muted">المواعيد بتوقيت القاهرة</div>

  </header>

      <option value="upcoming">قادمة</option>

    </select>
  </div>

  <section id="matches" aria-live="polite"></section>
</main>

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function arabicName(english){
    if(!english) return "";
    var key = String(english).trim().toLowerCase();
    return AR_TEAMS[key] || english;
  }

  function pad2(n){ return (n < 10 ? "0" : "") + n; }

  function cairoParts(date){
    try {
      var parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Africa/Cairo", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(date);
      var out = {};
      parts.forEach(function(p){ out[p.type] = p.value; });
      return { year: +out.year, month: +out.month, day: +out.day };
    } catch(e){
      return { year: date.getFullYear(), month: date.getMonth() + 1, day: date.getDate() };
    }
  }

  var weekdayFmt = null, monthDayFmt = null;
  try {
    weekdayFmt = new Intl.DateTimeFormat("ar-EG", { timeZone: "Africa/Cairo", weekday: "long" });
    monthDayFmt = new Intl.DateTimeFormat("ar-EG-u-nu-latn", { timeZone: "Africa/Cairo", day: "numeric", month: "numeric" });
  } catch(e){ /* fall back to numeric labels */ }

  function buildDays(){
    var now = new Date();
    var base = cairoParts(now);
    var out = [];
    for(var i = 0; i < 7; i++){
      var utc = Date.UTC(base.year, base.month - 1, base.day + i, 12, 0, 0);
      var d = new Date(utc);
      var label, dateLabel;
      if(i === 0) label = "اليوم";
      else if(i === 1) label = "بكرة";
      else label = weekdayFmt ? weekdayFmt.format(d) : "";
      dateLabel = monthDayFmt ? monthDayFmt.format(d) : "";
      out.push({
        stamp: "" + d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()),
        label: label,
        dateLabel: dateLabel
      });
    }
    return out;
  }

  function renderDays(){
    daysNav.innerHTML = DAYS.map(function(day, i){
      return '<button type="button" class="day' + (i === selectedDay ? ' active' : '') + '" data-day="' + i + '" aria-pressed="' + (i === selectedDay ? 'true' : 'false') + '">'
        + '<span class="dname">' + escapeHtml(day.label) + '</span>'
        + '<span class="ddate">' + escapeHtml(day.dateLabel) + '</span>'
        + '</button>';
    }).join("");
  }

  var kickoffFmt = null;
  try {
    kickoffFmt = new Intl.DateTimeFormat("ar-EG-u-nu-latn", { timeZone: "Africa/Cairo", hour: "numeric", minute: "2-digit", hour12: true });
  } catch(e){
    kickoffFmt = new Intl.DateTimeFormat("en-US", { hour: "numeric", minute: "2-digit", hour12: true });
  }

  function mapState(state){
    if(state === "in") return "live";
    if(state === "post") return "finished";
    return "upcoming";
  }

  function parseLeague(data, league){
    var out = [];
    var events = (data && data.events) || [];
    events.forEach(function(ev){
      try {
        var comp = ev.competitions && ev.competitions[0];
        if(!comp || !comp.competitors) return;
        var home = null, away = null;
        comp.competitors.forEach(function(c){
          if(c.homeAway === "home") home = c;
          else if(c.homeAway === "away") away = c;
        });
        if(!home || !away) return;
        var statusObj = ev.status || comp.status || {};
        var typeObj = statusObj.type || {};
        var state = mapState(typeObj.state);
        var dateObj = new Date(ev.date);
        var homeEn = (home.team && (home.team.displayName || home.team.shortDisplayName || home.team.name)) || "";
        var awayEn = (away.team && (away.team.displayName || away.team.shortDisplayName || away.team.name)) || "";
        var homeLogo = (home.team && home.team.logo) || "";
        var awayLogo = (away.team && away.team.logo) || "";
        var center, statusText;
        if(state === "upcoming"){
          center = isNaN(dateObj.getTime()) ? "" : kickoffFmt.format(dateObj);
          statusText = "لم تبدأ";
        } else {
          var hs = home.score != null && home.score !== "" ? home.score : "0";
          var as = away.score != null && away.score !== "" ? away.score : "0";
          center = hs + " - " + as;
          if(state === "live"){
            var clock = statusObj.displayClock || typeObj.shortDetail || "";
            statusText = clock ? ("مباشر • " + clock) : "مباشر";
          } else {
            statusText = "انتهت";
          }
        }
        out.push({
          home: arabicName(homeEn),
          away: arabicName(awayEn),
          homeEn: homeEn,
          awayEn: awayEn,
          homeLogo: homeLogo,
          awayLogo: awayLogo,
          league: league.name,
          center: center,
          statusText: statusText,
          state: state,
          ts: isNaN(dateObj.getTime()) ? 0 : dateObj.getTime()
        });
      } catch(e){ /* skip malformed event */ }
    });
    return out;
  }

  function logoImg(url){
    if(!url) return "";
    return '<img src="' + escapeHtml(url) + '" alt="" width="24" height="24" loading="lazy" onerror="this.style.display=\'none\'">';
  }

  function render() {
    var stamp = DAYS[selectedDay].stamp;
    if(!dayLoaded[stamp]){
      list.innerHTML = '<p class="empty">جارٍ تحميل المباريات…</p>';
      return;
    }
    var games = dayCache[stamp] || [];
    var term = search.value.trim().toLowerCase();
    var status = filter.value;

    if(!games.length){
      list.innerHTML = '<p class="empty">لا توجد مباريات في هذا اليوم.</p>';
      return;
    }

    var shown = games.filter(function(game){
      var hay = (game.home + " " + game.away + " " + game.homeEn + " " + game.awayEn + " " + game.league).toLowerCase();
      return hay.includes(term) && (status === "all" || game.state === status);
    });

    if(!shown.length){
      list.innerHTML = '<p class="empty">لا توجد مباريات مطابقة.</p>';
      return;
    }

    list.innerHTML = shown.map(function(game){
      var isLive = game.state === "live";
      return '<article class="match">'
        + '<div class="league">' + escapeHtml(game.league) + '</div>'
        + '<div class="team">' + escapeHtml(game.home) + logoImg(game.homeLogo) + '</div>'
        + '<div class="score">' + escapeHtml(game.center)
        + '<span class="status' + (isLive ? ' live' : '') + '"><span class="dot" aria-hidden="true"></span>' + escapeHtml(game.statusText) + '</span>'
        + '</div>'
        + '<div class="team">' + logoImg(game.awayLogo) + escapeHtml(game.away) + '</div>'
        + '</article>';
    }).join("");
  }

  function loadDay(index) {
    var day = DAYS[index];
    if(!day) return;
    var stamp = day.stamp;
    var jobs = LEAGUES.map(function(league){
      var url = "https://site.api.espn.com/apis/site/v2/sports/soccer/" + league.slug + "/scoreboard?dates=" + stamp;
      return fetch(url)
        .then(function(r){ if(!r.ok) throw new Error("http " + r.status); return r.json(); })
        .then(function(data){ return parseLeague(data, league); })
        .catch(function(){ return []; });
    });
    Promise.all(jobs).then(function(results){
      var all = [];
      results.forEach(function(part){ all = all.concat(part); });
      all.sort(function(a, b){ return a.ts - b.ts; });
      dayCache[stamp] = all;
      dayLoaded[stamp] = true;
      if(index === selectedDay) render();
    });
  }

  function selectDay(index) {
    if(index === selectedDay && dayLoaded[DAYS[index].stamp]) { render(); return; }
    selectedDay = index;
    renderDays();
    render();
    if(!dayLoaded[DAYS[index].stamp]) loadDay(index);
  }

  daysNav.addEventListener("click", function(e){
    var btn = e.target;
    while(btn && btn !== daysNav && !(btn.getAttribute && btn.getAttribute("data-day"))) btn = btn.parentNode;
    if(!btn || btn === daysNav) return;
    selectDay(parseInt(btn.getAttribute("data-day"), 10));
  });

  DAYS = buildDays();
  renderDays();

  search.addEventListener("input", render);
  filter.addEventListener("change", render);
  render();
  loadDay(0);
  setInterval(function(){ loadDay(selectedDay); }, 60000);
</script>
</body>
</html>
