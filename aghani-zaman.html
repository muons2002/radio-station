<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أغاني الزمن الجميل — جنود الخفاء</title>
<style>
:root{--bg:#0a1628;--bg2:#0e1f3a;--card:#12294d;--cyan:#2fb9d8;--gold:#e8b64c;--txt:#eef4fb;--mut:#9db4cc}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--txt);font-family:"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh;padding-bottom:118px}
header{text-align:center;padding:26px 14px 8px}
.brand{color:var(--cyan);font-weight:700;letter-spacing:.5px;font-size:15px}
h1{color:var(--gold);font-size:32px;margin:6px 0 4px;text-shadow:0 2px 14px rgba(232,182,76,.25)}
.sub{color:var(--mut);font-size:14px}
.wrap{max-width:860px;margin:0 auto;padding:10px 14px}
h2.sec{font-size:19px;margin:22px 2px 12px;color:#fff;border-right:4px solid var(--cyan);padding-right:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid rgba(47,185,216,.22);border-radius:16px;padding:16px 10px 13px;text-align:center;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--cyan)}
.tile{width:62px;height:62px;margin:0 auto 9px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:31px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.card .nm{font-weight:700;font-size:16px}
.card .ct{color:var(--mut);font-size:12.5px;margin-top:3px}
.card.soon{opacity:.45;cursor:default}
.card.soon:hover{transform:none;border-color:rgba(47,185,216,.22)}
#view{display:none}
.back{background:none;border:1px solid var(--cyan);color:var(--cyan);border-radius:10px;padding:7px 14px;font-size:14px;cursor:pointer;margin-bottom:12px}
.vhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.vhead .tile{margin:0;width:54px;height:54px;font-size:27px}
.vhead .nm{font-size:21px;font-weight:800}
.vhead .ct{color:var(--mut);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input{flex:1;min-width:150px;background:#0a1a33;border:1px solid rgba(47,185,216,.3);border-radius:10px;color:#fff;padding:10px 12px;font-size:14px}
.tools button{background:var(--cyan);border:none;color:#04263a;font-weight:700;border-radius:10px;padding:10px 14px;cursor:pointer;font-size:14px}
.row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:11px 12px;margin-bottom:7px;cursor:pointer}
.row:hover{border-color:var(--cyan)}
.row.on{border-color:var(--gold);background:rgba(232,182,76,.08)}
.row .n{color:var(--mut);font-size:12px;min-width:26px;text-align:center}
.row .t{flex:1;font-size:15px;line-height:1.5}
.row .p{color:var(--cyan);font-size:17px;min-width:26px;text-align:center}
.eq{display:inline-flex;gap:2.5px;align-items:flex-end;height:15px;min-width:26px;justify-content:center}
.eq i{width:3.5px;background:var(--gold);border-radius:2px;height:5px;animation:eqb .7s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.18s}.eq i:nth-child(3){animation-delay:.36s}.eq i:nth-child(4){animation-delay:.1s}
body:not(.playing) .eq i{animation-play-state:paused;height:5px}
@keyframes eqb{0%,100%{height:5px}50%{height:15px}}
#player{position:fixed;bottom:0;right:0;left:0;background:rgba(8,20,38,.97);border-top:1px solid rgba(47,185,216,.35);padding:10px 14px 12px;backdrop-filter:blur(6px)}
#ptitle{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#psinger{color:var(--mut);font-size:12px;margin-bottom:6px}
.pctl{display:flex;align-items:center;gap:9px}
.pctl button{background:none;border:none;color:#fff;font-size:23px;cursor:pointer;padding:2px 4px}
#playBtn{font-size:30px;color:var(--gold)}
#seek{flex:1;accent-color:var(--cyan);height:4px;min-width:60px}
#vol{width:74px;accent-color:var(--gold);height:4px}
.volic{font-size:16px}
#time{color:var(--mut);font-size:11.5px;min-width:76px;text-align:center}
.foot{text-align:center;color:var(--mut);font-size:12.5px;padding:16px 10px 4px}
.empty{color:var(--mut);text-align:center;padding:24px 0}
</style>
</head>
<body>
<header>
<div class="brand">🛡️ جنود الخفاء — حب الخير للغير</div>
<h1>🎵 أغاني الزمن الجميل</h1>
<div class="sub">613 أغنية • عمالقة الطرب وشعبيات الزمن الجميل ودبكات وميكس ديسكو</div>
</header>
<div class="wrap" id="home"></div>
<div class="wrap" id="view">
  <button class="back" onclick="goHome()">⬅ كل المطربين</button>
  <div class="vhead"><div class="tile" id="vTile"></div><div><div class="nm" id="vName"></div><div class="ct" id="vCount"></div></div></div>
  <div class="tools">
    <input id="q" type="search" placeholder="🔍 دور على أغنية..." oninput="renderTracks()">
    <button onclick="playAll(false)">▶ تشغيل الكل</button>
    <button onclick="playAll(true)">🔀 عشوائي</button>
  </div>
  <div id="list"></div>
</div>
<div class="foot">أغاني الزمن الجميل — جنود الخفاء 🛡️ كل الأغاني من أرشيف الإنترنت المفتوح</div>
<div id="player">
  <div id="ptitle">اختر أغنية للتشغيل 🎶</div>
  <div id="psinger"></div>
  <div class="pctl">
    <button onclick="step(1)" title="التالي">⏮</button>
    <button id="playBtn" onclick="toggle()">▶</button>
    <button onclick="step(-1)" title="السابق">⏭</button>
    <input id="seek" type="range" min="0" max="1000" value="0" oninput="seekTo()">
    <span id="time">0:00 / 0:00</span>
    <span class="volic">🔊</span>
    <input id="vol" type="range" min="0" max="100" value="100" oninput="setVol()" title="مستوى الصوت">
  </div>
</div>

const SINGERS = [
 {sec:"⭐ عمالقة الطرب"},
 {id:"halim", nm:"عبد الحليم حافظ", em:"🎙️", g:"linear-gradient(135deg,#7b2d8b,#c0392b)"},
 {id:"layla", nm:"ليلى مراد", em:"🌙", g:"linear-gradient(135deg,#b03a6b,#e88bb0)"},
 {id:"souad", nm:"سعاد محمد", em:"🎤", g:"linear-gradient(135deg,#0e7a6d,#39c2a5)"},
 {id:"wahab", nm:"محمد عبد الوهاب", em:"🎼", g:"linear-gradient(135deg,#8a6d1f,#e8b64c)"},
 {id:"warda", nm:"وردة الجزائرية", em:"🌹", g:"linear-gradient(135deg,#a31621,#e05260)"},
 {id:"najah", nm:"نجاح سلام", em:"🌺", g:"linear-gradient(135deg,#b8860b,#e8b64c)"},
 {id:"mayada", nm:"ميادة الحناوي", em:"✨", g:"linear-gradient(135deg,#5b2a86,#a86bd8)"},
 {sec:"🎻 شعبيات الزمن الجميل"},
 {id:"bahr", nm:"بحر أبو جريشة", em:"🌊", g:"linear-gradient(135deg,#14508c,#2fb9d8)"},
 {sec:"🥁 دبكات وأفراح"},
 {id:"dabka", nm:"دبكات فلسطينية وشامية", em:"🥁", g:"linear-gradient(135deg,#1e7a34,#7ac74f)"},
 {sec:"🪩 ميكس أجنبي — ديسكو وحفلات"},
 {id:"boneym", nm:"Boney M", em:"🪩", g:"linear-gradient(135deg,#f39c12,#8e44ad)"},
 {sec:"🔜 قريباً — بنجهز مجموعاتهم"},
 {soon:1, nm:"فيروز", em:"🌄", g:"linear-gradient(135deg,#546e7a,#90a4ae)"},
 {soon:1, nm:"فريد الأطرش", em:"🎻", g:"linear-gradient(135deg,#546e7a,#90a4ae)"},
 {soon:1, nm:"نجاة الصغيرة", em:"🕊️", g:"linear-gradient(135deg,#546e7a,#90a4ae)"},
 {soon:1, nm:"أسمهان", em:"⭐", g:"linear-gradient(135deg,#546e7a,#90a4ae)"},
 {soon:1, nm:"سيد درويش", em:"🪕", g:"linear-gradient(135deg,#546e7a,#90a4ae)"},
 {soon:1, nm:"ABBA & Modern Talking", em:"💿", g:"linear-gradient(135deg,#546e7a,#90a4ae)"}
];
const au = document.getElementById('au');
let cur = null, queue = [], qi = -1;
function home(){
  const h = document.getElementById('home'); let s = ''; let open = false;
  for(const it of SINGERS){
    if(it.sec){ if(open) s += '</div>'; s += '<h2 class="sec">' + it.sec + '</h2><div class="grid">'; open = true; continue; }
    if(it.soon){ s += '<div class="card soon"><div class="tile" style="background:' + it.g + '">' + it.em + '</div><div class="nm">' + it.nm + '</div><div class="ct">قريباً 🔜</div></div>'; continue; }
    const n = (DATA[it.id] || []).length;
    s += '<div class="card" onclick="openSinger(\'' + it.id + '\')"><div class="tile" style="background:' + it.g + '">' + it.em + '</div><div class="nm">' + it.nm + '</div><div class="ct">' + n + ' أغنية</div></div>';
  }
  h.innerHTML = s + (open ? '</div>' : '');
}
function openSinger(id){
  cur = SINGERS.find(x => x.id === id);
  document.getElementById('home').style.display = 'none';
  document.getElementById('view').style.display = 'block';
  document.getElementById('vTile').style.background = cur.g;
  document.getElementById('vTile').textContent = cur.em;
  document.getElementById('vName').textContent = cur.nm;
  document.getElementById('vCount').textContent = (DATA[id] || []).length + ' أغنية';
  document.getElementById('q').value = '';
  window.scrollTo(0,0);
  renderTracks();
}
function goHome(){
  document.getElementById('view').style.display = 'none';
  document.getElementById('home').style.display = 'block';
  window.scrollTo(0,0);
}
function curList(){
  const q = document.getElementById('q').value.trim();
  const all = DATA[cur.id] || [];
  return q ? all.filter(x => x.t.includes(q)) : all;
}
function renderTracks(){
  const list = curList();
  const el = document.getElementById('list');
  if(!list.length){ el.innerHTML = '<div class="empty">لا توجد نتائج مطابقة</div>'; return; }
  el.innerHTML = list.map((x) => {
    const gi = (DATA[cur.id] || []).indexOf(x);
    const isCur = (qi >= 0 && queue[qi] === gi && window._curId === cur.id);
    const mark = isCur ? '<span class="eq"><i></i><i></i><i></i><i></i></span>' : '<span class="p">▶</span>';
    return '<div class="row' + (isCur ? ' on' : '') + '" onclick="playIdx(' + gi + ')"><span class="n">' + (gi + 1) + '</span><span class="t">' + x.t.replace(/</g,'&lt;') + '</span>' + mark + '</div>';
  }).join('');
}
function playIdx(gi){
  queue = (DATA[cur.id] || []).map((_, i) => i);
  qi = queue.indexOf(gi);
  window._curId = cur.id;
  startTrack();
}
function playAll(shuf){
  const list = curList();
  if(!list.length) return;
  const all = DATA[cur.id] || [];
  queue = list.map(x => all.indexOf(x));
  if(shuf) queue.sort(() => Math.random() - .5);
  qi = 0; window._curId = cur.id;
  startTrack();
}
function startTrack(){
  const tr = (DATA[window._curId] || [])[queue[qi]];
  if(!tr) return;
  au.src = tr.u;
  au.play().catch(()=>{});
  const s = SINGERS.find(x => x.id === window._curId);
  document.getElementById('ptitle').textContent = tr.t;
  document.getElementById('psinger').textContent = s ? s.nm : '';
  document.getElementById('playBtn').textContent = '⏸';
  if(document.getElementById('view').style.display === 'block' && cur && cur.id === window._curId) renderTracks();
  if('mediaSession' in navigator){ try{ navigator.mediaSession.metadata = new MediaMetadata({title: tr.t, artist: s ? s.nm : '', album: 'أغاني الزمن الجميل — جنود الخفاء'}); }catch(e){} }
}
function toggle(){
  if(!au.src){ return; }
  if(au.paused){ au.play(); document.getElementById('playBtn').textContent = '⏸'; }
  else { au.pause(); document.getElementById('playBtn').textContent = '▶'; }
}
function step(d){
  if(qi < 0 || !queue.length) return;
  qi = (qi + d + queue.length) % queue.length;
  startTrack();
}
function fmt(s){ if(!isFinite(s) || s < 0) return '0:00'; s = Math.floor(s); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function setVol(){
  const v = document.getElementById('vol').value;
  au.volume = v / 100;
  try{ localStorage.setItem('az_vol', v); }catch(e){}
}
au.addEventListener('timeupdate', () => {
  const sk = document.getElementById('seek');
  if(au.duration && au.currentTime <= au.duration) sk.value = Math.floor(au.currentTime / au.duration * 1000);
  document.getElementById('time').textContent = fmt(au.currentTime) + ' / ' + fmt(au.duration);
});
au.addEventListener('ended', () => step(1));
au.addEventListener('pause', () => { document.getElementById('playBtn').textContent = '▶'; document.body.classList.remove('playing'); if(document.getElementById('view').style.display === 'block') renderTracks(); });
au.addEventListener('play', () => { document.getElementById('playBtn').textContent = '⏸'; document.body.classList.add('playing'); if(document.getElementById('view').style.display === 'block') renderTracks(); });
function seekTo(){
  const sk = document.getElementById('seek');
  if(au.duration) au.currentTime = sk.value / 1000 * au.duration;
}
try{ const sv = localStorage.getItem('az_vol'); if(sv !== null){ document.getElementById('vol').value = sv; au.volume = sv / 100; } }catch(e){}
home();
</script>
