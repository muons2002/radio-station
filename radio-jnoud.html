<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>راديو جنود الخفاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
  :root{
    --bg:#0d0b08;
    --bg2:#14110b;
    --card:#1a1712;
    --card2:#211c14;
    --line:#3a3222;
    --line-soft:#2a2519;
    --gold:#d9a92c;
    --gold-hi:#f0c94e;
    --gold-dim:#9a7d2e;
    --text:#f3ecd9;
    --muted:#b3a888;
    --faint:#7d735c;
    --danger:#e0654f;
    --ok:#7fc96b;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:
      radial-gradient(900px 480px at 85% -120px, rgba(217,169,44,.10), transparent 60%),
      radial-gradient(700px 420px at 8% 0, rgba(217,169,44,.05), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:"Cairo", system-ui, "Segoe UI", Tahoma, sans-serif;
    min-height:100vh;
    padding-bottom:118px;
  }
  .wrap{max-width:1060px;margin:0 auto;padding:0 16px}

  /* ---------- Header ---------- */
  header{padding:30px 0 8px;text-align:center}
  .shield{width:58px;height:66px;margin:0 auto 8px;display:block}
  h1{margin:0;font-size:clamp(30px,6vw,44px);font-weight:900;color:var(--gold-hi);letter-spacing:.2px;line-height:1.25}
  .tagline{margin:4px 0 0;color:var(--muted);font-size:15px;font-weight:600}
  .clockrow{margin-top:12px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--line);background:var(--card);
    border-radius:999px;padding:5px 14px;font-size:13.5px;color:var(--muted);font-weight:700;
  }
  .chip b{color:var(--gold-hi);font-variant-numeric:tabular-nums}
  .livedot{width:8px;height:8px;border-radius:50%;background:var(--danger);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* ---------- Controls ---------- */
  .controls{margin:22px 0 6px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .fbtn{
    appearance:none;border:1px solid var(--line);background:var(--card);
    color:var(--muted);font-family:inherit;font-size:15px;font-weight:800;
    padding:9px 18px;border-radius:999px;cursor:pointer;transition:.18s;
  }
  .fbtn .cnt{font-size:12.5px;color:var(--faint);font-weight:700}
  .fbtn:hover{border-color:var(--gold-dim);color:var(--text)}
  .fbtn.active{background:var(--gold);border-color:var(--gold);color:#171204}
  .fbtn.active .cnt{color:#5c4a10}
  .search{margin:14px auto 0;max-width:460px;position:relative}
  .search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--faint);fill:none;stroke-width:2}
  .search input{
    width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;
    color:var(--text);font-family:inherit;font-size:15.5px;padding:11px 42px 11px 14px;outline:none;
  }
  .search input:focus{border-color:var(--gold-dim)}
  .search input::placeholder{color:var(--faint)}

  /* ---------- Sections & cards ---------- */
  section{margin-top:26px}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 12px}
  .sec-head h2{margin:0;font-size:20px;font-weight:900;color:var(--gold-hi)}
  .sec-head span{color:var(--faint);font-size:13.5px;font-weight:700}
  .sec-head::after{content:"";flex:1;height:1px;background:var(--line-soft);align-self:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}

  .card{
    background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line-soft);border-radius:var(--radius);
    padding:14px 16px;display:flex;gap:13px;align-items:center;
    transition:border-color .18s, background .18s;
    scroll-margin-bottom:150px;
  }
  .card:hover{border-color:var(--line)}
  .card.playing{border-color:var(--gold);background:linear-gradient(180deg,#2b2312,var(--card))}
  .card.error{border-color:var(--danger)}
  .pbtn{
    flex:none;width:52px;height:52px;border-radius:50%;border:1.5px solid var(--gold-dim);
    background:#100d07;color:var(--gold-hi);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.18s;padding:0;
    scroll-margin-bottom:190px;scroll-margin-top:20px;
  }
  .pbtn:hover{background:var(--gold);color:#171204;border-color:var(--gold)}
  .card.playing .pbtn{background:var(--gold);color:#171204;border-color:var(--gold)}
  .pbtn svg{width:22px;height:22px;fill:currentColor}
  .pbtn .spin{
    width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(240,201,78,.35);
    border-top-color:var(--gold-hi);animation:rot .7s linear infinite;display:none;
  }
  .pbtn.loading .spin{display:block}
  .pbtn.loading svg{display:none}
  @keyframes rot{to{transform:rotate(360deg)}}
  .info{flex:1;min-width:0}
  .name{font-size:16.5px;font-weight:800;line-height:1.4}
  .meta{margin-top:2px;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:11.5px;font-weight:800;color:var(--gold-hi);border:1px solid var(--line);border-radius:6px;padding:1px 8px;background:rgba(217,169,44,.07)}
  .tag.country{color:var(--muted)}
  .eq{display:none;align-items:flex-end;gap:2.5px;height:18px;flex:none}
  .card.playing .eq{display:flex}
  .eq i{width:3.5px;background:var(--gold-hi);border-radius:2px;animation:eq 0.9s ease-in-out infinite}
  .eq i:nth-child(1){height:60%;animation-delay:0s}
  .eq i:nth-child(2){height:100%;animation-delay:.22s}
  .eq i:nth-child(3){height:45%;animation-delay:.45s}
  .eq i:nth-child(4){height:80%;animation-delay:.12s}
  @keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
  .card.paused .eq i{animation-play-state:paused}
  .card .err-msg{display:none;color:var(--danger);font-size:12.5px;font-weight:700;margin-top:5px;white-space:normal}
  .card.error .err-msg{display:block}

  /* Featured (جنود الخفاء) */
  .card.featured{
    grid-column:1/-1;padding:20px 22px;
    border:1.5px solid var(--gold-dim);
    background:
      radial-gradient(500px 200px at 90% -40px, rgba(217,169,44,.16), transparent 60%),
      linear-gradient(180deg,#2a2210,#1a160d);
  }
  .card.featured .pbtn{width:64px;height:64px}
  .card.featured .pbtn svg{width:28px;height:28px}
  .card.featured .name{font-size:clamp(20px,4vw,26px);font-weight:900;color:var(--gold-hi)}
  .card.featured .meta{font-size:14.5px}
  .badge-ours{background:var(--gold);color:#171204;border-color:var(--gold)}

  .empty{display:none;text-align:center;color:var(--faint);font-weight:700;padding:34px 0;font-size:15.5px}
  .empty.show{display:block}

  footer{margin-top:38px;text-align:center;color:var(--faint);font-size:13px;font-weight:600}

  /* ---------- Bottom player bar ---------- */
  .player{
    position:fixed;inset-inline:0;bottom:0;z-index:50;
    background:rgba(16,13,8,.96);backdrop-filter:blur(8px);
    border-top:1.5px solid var(--gold-dim);
    padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  }
  .player .wrap{display:flex;align-items:center;gap:14px}
  .np{min-width:0;flex:1}
  .np .np-label{font-size:11px;color:var(--faint);font-weight:800;letter-spacing:.4px}
  .np .np-name{font-size:16.5px;font-weight:900;color:var(--gold-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
  .np .np-status{font-size:12.5px;color:var(--muted);font-weight:700}
  .np .np-status.err{color:var(--danger)}
  .np .np-status.ok{color:var(--ok)}
  .pcontrols{display:flex;align-items:center;gap:10px;flex:none}
  .mainbtn{
    width:56px;height:56px;border-radius:50%;border:none;background:var(--gold);color:#171204;
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.18s;padding:0;
  }
  .mainbtn:hover{background:var(--gold-hi)}
  .mainbtn:disabled{opacity:.45;cursor:default}
  .mainbtn svg{width:26px;height:26px;fill:currentColor}
  .mainbtn .spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(23,18,4,.3);border-top-color:#171204;animation:rot .7s linear infinite;display:none}
  .mainbtn.loading .spin{display:block}
  .mainbtn.loading svg{display:none}
  .stopbtn{
    width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
  }
  .stopbtn:hover{color:var(--text);border-color:var(--gold-dim)}
  .stopbtn svg{width:15px;height:15px;fill:currentColor}
  .vol{display:flex;align-items:center;gap:8px;flex:none}
  .vol button{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:flex}
  .vol button svg{width:21px;height:21px;fill:currentColor}
  .vol input[type=range]{
    -webkit-appearance:none;appearance:none;width:110px;height:5px;border-radius:3px;
    background:linear-gradient(to left,var(--gold) var(--fill,80%),#3a3222 var(--fill,80%));
    outline:none;cursor:pointer;direction:ltr;
  }
  .vol input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--gold-hi);
    border:2px solid #171204;box-shadow:0 0 0 1px var(--gold-dim);
  }
  .vol input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--gold-hi);border:2px solid #171204}

  @media (max-width:640px){
    body{padding-bottom:170px}
    header{padding-top:16px}
    .clockrow{margin-top:8px}
    .controls{margin-top:12px}
    .fbtn{padding:7px 16px}
    .search{margin-top:10px}
    section{margin-top:18px}
    .card{scroll-margin-bottom:180px}
    .grid{grid-template-columns:1fr}
    .vol input[type=range]{width:74px}
    .np .np-name{font-size:15px}
    .mainbtn{width:50px;height:50px}
  }
  @media (prefers-reduced-motion: reduce){
    .eq i,.livedot{animation:none}
    html{scroll-behavior:auto}
  }
</style>
</head>

  { name:"Dinámica 92.9 FM", country:"فنزويلا", cat:"latin", note:"ديناميكا 92.9 FM — موسيقى وبرامج", url:"https://guri.tepuyserver.net/8012/stream" },
  { name:"Radiorama 103.3 FM", country:"فنزويلا", cat:"latin", note:"راديوراما 103.3 FM — أغاني لاتينية", url:"https://acp2.lorini.net:44002/stream" },
  { name:"Rumba 98.1 FM", country:"فنزويلا", cat:"latin", note:"رومبا 98.1 FM — سالسا وموسيقى لاتينية", url:"https://cast20.plugstreaming.com:2020/stream/r981/;" },
  { name:"WOAO! 88 UNO FM", country:"فنزويلا", cat:"latin", note:"واو 88 أونو FM — هيتس لاتينية", url:"https://stream.zeno.fm/361as28sbc9uv" },
  { name:"RADIO RUMBOS 670 AM", country:"فنزويلا", cat:"latin", note:"راديو رومبوس 670 AM — أخبار وبرامج", url:"https://stream.zeno.fm/c3q3w8zfe18uv" },
  { name:"Fiesta Latina 106.1 FM", country:"فنزويلا", cat:"latin", note:"فييستا لاتينا 106.1 FM — حفلة لاتينية على الهواء", url:"https://stream.zeno.fm/e2kzfpr34d0uv" },
  { name:"Radio Minuto 790 AM", country:"فنزويلا", cat:"latin", note:"راديو مينوتو 790 AM — أخبار وبرامج", url:"https://stream.zeno.fm/rnafoozvpiitv" },
  { name:"Super Trendy 101.9 FM", country:"فنزويلا", cat:"latin", note:"سوبر ترندي 101.9 FM — أحدث الأغاني اللاتينية", url:"https://live.ajfnetwork.com.ve/musikvalencia/stream" },
  { name:"Hot Sports 94.1 FM", country:"فنزويلا", cat:"latin", note:"هوت سبورتس 94.1 FM — رياضة وموسيقى", url:"https://acp2.lorini.net:58300/stream" }
];

var ICON_PLAY  = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
var ICON_PAUSE = '<svg viewBox="0 0 24 24"><rect x="5.5" y="4.5" width="4.6" height="15" rx="1.4"/><rect x="13.9" y="4.5" width="4.6" height="15" rx="1.4"/></svg>';

var audio    = document.getElementById('audio');
var sectionsEl = document.getElementById('sections');
var filtersEl  = document.getElementById('filters');
var searchEl   = document.getElementById('search');
var emptyEl    = document.getElementById('empty');
var npName     = document.getElementById('npName');
var npStatus   = document.getElementById('npStatus');
var mainBtn    = document.getElementById('mainBtn');
var stopBtn    = document.getElementById('stopBtn');
var volRange   = document.getElementById('volRange');
var muteBtn    = document.getElementById('muteBtn');

var current = -1;          // index of selected station
var state = 'idle';        // idle | loading | playing | paused | error
var activeFilter = 'all';
var cardEls = [];

function catLabel(id){
  for (var i=0;i<CATS.length;i++) if (CATS[i].id===id) return CATS[i].label;
  return id;
}
function catCount(id){
  if (id==='all') return STATIONS.length;
  return STATIONS.filter(function(s){return s.cat===id;}).length;
}

/* ---------- Build filters ---------- */
CATS.forEach(function(c){
  var b = document.createElement('button');
  b.className = 'fbtn' + (c.id==='all' ? ' active' : '');
  b.setAttribute('role','tab');
  b.dataset.cat = c.id;
  b.innerHTML = c.label + ' <span class="cnt">' + catCount(c.id) + '</span>';
  b.addEventListener('click', function(){
    activeFilter = c.id;
    document.querySelectorAll('.fbtn').forEach(function(x){ x.classList.toggle('active', x.dataset.cat===c.id); });
    applyVisibility();
  });
  filtersEl.appendChild(b);
});

/* ---------- Build station cards, grouped by section ---------- */
['arab','sport','hits','latin'].forEach(function(catId){
  var sec = document.createElement('section');
  sec.dataset.cat = catId;
  var list = STATIONS.map(function(s,i){ return {s:s,i:i}; }).filter(function(x){ return x.s.cat===catId; });
  sec.innerHTML = '<div class="sec-head"><h2>' + catLabel(catId) + '</h2><span>' + list.length + ' إذاعة</span></div>';
  var grid = document.createElement('div');
  grid.className = 'grid';
  list.forEach(function(x){
    var s = x.s, idx = x.i;
    var card = document.createElement('article');
    card.className = 'card' + (s.featured ? ' featured' : '');
    card.dataset.idx = idx;
    card.innerHTML =
      '<button class="pbtn" aria-label="تشغيل ' + s.name + '">' + ICON_PLAY + '<span class="spin"></span></button>' +
      '<div class="info">' +
        '<div class="name">' + s.name + '</div>' +
        '<div class="meta">' + s.note + '</div>' +
        '<div class="tags">' +
          (s.featured ? '<span class="tag badge-ours">إذاعتنا</span>' : '') +
          '<span class="tag country">' + s.country + '</span>' +
          '<span class="tag">' + catLabel(s.cat) + '</span>' +
        '</div>' +
        '<div class="err-msg">تعذر تشغيل هذه الإذاعة حالياً — قد تكون متوقفة مؤقتاً، جرّب إذاعة أخرى.</div>' +
      '</div>' +
      '<div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>';
    card.querySelector('.pbtn').addEventListener('click', function(){ toggleStation(idx); });
    grid.appendChild(card);
    cardEls[idx] = card;
  });
  sec.appendChild(grid);
  sectionsEl.appendChild(sec);
});

/* ---------- Filter + search visibility ---------- */
function applyVisibility(){
  var q = searchEl.value.trim();
  var anyVisible = false;
  document.querySelectorAll('section[data-cat]').forEach(function(sec){
    var catOk = (activeFilter==='all' || sec.dataset.cat===activeFilter);
    var secVisible = false;
    sec.querySelectorAll('.card').forEach(function(card){
      var s = STATIONS[+card.dataset.idx];
      var show = catOk && (!q || s.name.indexOf(q) > -1 || s.country.indexOf(q) > -1 || s.note.indexOf(q) > -1);
      card.style.display = show ? '' : 'none';
      if (show) secVisible = true;
    });
    sec.style.display = secVisible ? '' : 'none';
    if (secVisible) anyVisible = true;
  });
  emptyEl.classList.toggle('show', !anyVisible);
}
searchEl.addEventListener('input', applyVisibility);

/* ---------- Playback ---------- */
function setStatus(txt, cls){
  npStatus.textContent = txt;
  npStatus.className = 'np-status' + (cls ? ' ' + cls : '');
}
function refreshCard(idx){
  var card = cardEls[idx];
  if (!card) return;
  var btn = card.querySelector('.pbtn');
  card.classList.toggle('playing', idx===current && (state==='playing' || state==='loading' || state==='paused'));
  card.classList.toggle('paused', idx===current && state==='paused');
  card.classList.toggle('error', idx===current && state==='error');
  btn.classList.toggle('loading', idx===current && state==='loading');
  btn.innerHTML = ((idx===current && state==='playing') ? ICON_PAUSE : ICON_PLAY) + '<span class="spin"></span>';
  btn.setAttribute('aria-label', (idx===current && state==='playing' ? 'إيقاف ' : 'تشغيل ') + STATIONS[idx].name);
}
function refreshAllCards(){ for (var i=0;i<STATIONS.length;i++) refreshCard(i); }
function refreshMainBtn(){
  mainBtn.disabled = (current < 0);
  mainBtn.classList.toggle('loading', state==='loading');
  document.getElementById('mainIcon').outerHTML =
    '<svg viewBox="0 0 24 24" id="mainIcon">' +
    (state==='playing' ? '<rect x="5.5" y="4.5" width="4.6" height="15" rx="1.4"/><rect x="13.9" y="4.5" width="4.6" height="15" rx="1.4"/>' : '<path d="M7 4.5v15l13-7.5z"/>') +
    '</svg>';
}

function playStation(idx){
  var s = STATIONS[idx];
  if (current !== idx){
    current = idx;
    audio.src = s.url;
    npName.textContent = s.name;
  }
  state = 'loading';
  setStatus('جاري الاتصال بالإذاعة…');
  refreshAllCards(); refreshMainBtn();
  var p = audio.play();
  if (p && p.catch) p.catch(function(){ onStreamError(); });
}
function pauseStream(){
  audio.pause();
  state = 'paused';
  setStatus('متوقف مؤقتاً');
  refreshAllCards(); refreshMainBtn();
}
function stopAll(){
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  current = -1; state = 'idle';
  npName.textContent = 'اختر إذاعة للبدء';
  setStatus('جاهز للتشغيل');
  refreshAllCards(); refreshMainBtn();
}
function toggleStation(idx){
  if (idx === current && state === 'playing'){ pauseStream(); return; }
  if (idx === current && state === 'paused'){ playStation(idx); return; }
  playStation(idx);
}
function onStreamError(){
  if (current < 0) return;
  state = 'error';
  setStatus('تعذر تشغيل هذه الإذاعة حالياً — جرّب إذاعة أخرى', 'err');
  refreshAllCards(); refreshMainBtn();
}

mainBtn.addEventListener('click', function(){
  if (current < 0) return;
  if (state === 'playing') pauseStream(); else playStation(current);
});
stopBtn.addEventListener('click', stopAll);

audio.addEventListener('playing', function(){
  state = 'playing';
  setStatus('يبث الآن مباشرة · ' + STATIONS[current].country, 'ok');
  refreshAllCards(); refreshMainBtn();
});
audio.addEventListener('waiting', function(){
  if (state === 'playing' || state === 'loading'){
    state = 'loading';
    setStatus('جاري التحميل…');
    refreshAllCards(); refreshMainBtn();
  }
});
audio.addEventListener('pause', function(){
  if (state === 'playing'){ state = 'paused'; setStatus('متوقف مؤقتاً'); refreshAllCards(); refreshMainBtn(); }
});
audio.addEventListener('error', function(){ if (current >= 0 && audio.getAttribute('src')) onStreamError(); });
audio.addEventListener('stalled', function(){ if (state==='playing') setStatus('الاتصال بطيء… جاري إعادة المحاولة'); });

/* ---------- Volume ---------- */
function paintVol(){
  volRange.style.setProperty('--fill', volRange.value + '%');
}
audio.volume = 0.8;
paintVol();
volRange.addEventListener('input', function(){
  audio.volume = volRange.value / 100;
  audio.muted = false;
  paintVol();
});
muteBtn.addEventListener('click', function(){
  audio.muted = !audio.muted;
  muteBtn.style.color = audio.muted ? 'var(--danger)' : '';
  if (audio.muted){ volRange.dataset.prev = volRange.value; }
});

/* ---------- Live clock (Cairo) ---------- */
function tickClock(){
  try {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('ar-EG', { timeZone:'Africa/Cairo', hour:'2-digit', minute:'2-digit', second:'2-digit' });
  } catch(e){
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('ar-EG');
  }
}
tickClock();
setInterval(tickClock, 1000);
</script>
</body>
