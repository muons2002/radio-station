<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>حكايات عبد العزيز العروي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #081426;
        --bg-2: #0c1d38;
        --card: #10233f;
        --card-hover: #16304f;
        --line: #1e3a5f;
        --gold: #d4af37;
        --gold-soft: #e8c95c;
        --gold-dim: rgba(212, 175, 55, 0.14);
        --text: #f4f0e2;
        --muted: #a7b8cf;
        --player-h: 148px;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; overflow-x: hidden; overflow-x: clip; }
      body {
        margin: 0;
        overflow-x: hidden;
        overflow-x: clip;
        background:
          radial-gradient(900px 420px at 50% -120px, rgba(212, 175, 55, 0.10), transparent 60%),
          linear-gradient(180deg, var(--bg-2), var(--bg) 340px);
        color: var(--text);
        font-family: "Cairo", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
      }
      button, input { font-family: inherit; }
      button { cursor: pointer; }

      /* ---------- Header ---------- */
      header {
        flex: 0 0 auto;
        text-align: center;
        padding: 18px 16px 8px;
      }

      /* ---------- Header clock with glowing halo ---------- */
      .clock-wrap {
        position: relative;
        width: 118px; height: 118px;
        margin: 0 auto;
        display: flex; align-items: center; justify-content: center;
      }
      .clock-halo {
        position: absolute;
        left: 50%; top: 50%;
        width: 168px; height: 168px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(232,201,92,.55) 0%, rgba(255,122,89,.30) 32%, rgba(94,200,255,.22) 50%, rgba(232,106,192,.14) 60%, rgba(212,175,55,0) 72%);
        filter: blur(10px);
        opacity: .3;
        transform: translate(-50%, -50%) scale(.78);
        pointer-events: none;
        will-change: transform, opacity;
      }
      .clock-halo.css-pulse { animation: haloPulse 1.7s ease-in-out infinite; }
      @keyframes haloPulse {
        0%, 100% { transform: translate(-50%, -50%) scale(.82); opacity: .38; }
        50% { transform: translate(-50%, -50%) scale(1.08); opacity: .8; }
      }
      .clock-ring {
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, #d4af37, #ff7a59, #e86ac0, #5ec8ff, #7be0a3, #d4af37);
        animation: ringSpin 16s linear infinite;
        pointer-events: none;
      }
      @keyframes ringSpin { to { transform: rotate(360deg); } }
      .clock-face {
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 32%, #132c50, #0a1830 78%);
        box-shadow: inset 0 0 0 1px rgba(212,175,55,.35), 0 6px 18px rgba(0,0,0,.45);
        display: flex; align-items: center; justify-content: center;
      }
      .clock-read {
        display: flex;
        align-items: baseline;
        direction: ltr;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      #clockTime { font-size: 27px; font-weight: 800; color: var(--text); letter-spacing: .5px; }
      .clock-sec { font-size: 15px; font-weight: 700; color: var(--gold-soft); }
      @media (prefers-reduced-motion: reduce) {
        .clock-ring { animation: none; }
        .clock-halo.css-pulse { animation: none; opacity: .3; }
      }
      header h1 {
        font-family: "Amiri", serif;
        font-size: clamp(30px, 7vw, 44px);
        margin: 8px 0 4px;
        color: var(--gold-soft);
        font-weight: 700;
      }
      header p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        font-weight: 600;
      }
      header p .brand { color: var(--gold); }

      /* ---------- Sticky controls ---------- */
      .controls {
        flex: 0 0 auto;
        background: rgba(8, 20, 38, 0.94);
        padding: 12px 14px 10px;
        border-bottom: 1px solid var(--line);
      }
      .wrap { max-width: 760px; margin: 0 auto; }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .tab {
        flex: 1;
        min-height: 48px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--muted);
        font-size: 16px;
        font-weight: 700;
        padding: 8px 6px;
        transition: background .15s, color .15s, border-color .15s;
      }
      .tab .count {
        display: inline-block;
        background: rgba(255,255,255,.08);
        border-radius: 999px;
        padding: 0 8px;
        font-size: 13px;
        margin-inline-start: 4px;
      }
      .tab.active {
        background: var(--gold);
        border-color: var(--gold);
        color: #1a1405;
      }
      .tab.active .count { background: rgba(0,0,0,.18); }
      .search-box { position: relative; }
      .search-box svg {
        position: absolute;
        inset-inline-start: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 20px; height: 20px;
        stroke: var(--muted);
        pointer-events: none;
      }
      #search {
        width: 100%;
        min-height: 48px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
        font-size: 16px;
        padding: 10px 44px 10px 14px;
        outline: none;
      }
      #search:focus { border-color: var(--gold); }
      #search::placeholder { color: var(--muted); }
      .result-line {
        color: var(--muted);
        font-size: 13.5px;
        margin: 8px 2px 0;
      }

      /* ---------- List ---------- */
      main {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 12px 14px 30px;
      }
      .list { display: flex; flex-direction: column; gap: 8px; }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        scroll-margin-top: 10px;
        scroll-margin-bottom: 10px;
        width: 100%;
        min-height: 58px;
        text-align: start;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px 14px;
        color: var(--text);
        transition: background .15s, border-color .15s;
      }
      .row:hover { background: var(--card-hover); }
      .row .num {
        flex: 0 0 auto;
        width: 38px; height: 38px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--bg-2);
        color: var(--muted);
        display: flex; align-items: center; justify-content: center;
        font-size: 14.5px; font-weight: 700;
      }
      .row .title {
        flex: 1 1 auto;
        font-size: 16.5px;
        font-weight: 600;
        line-height: 1.5;
        min-width: 0;
      }
      .row .dur {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 13.5px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        direction: ltr;
      }
      .row .eq { display: none; flex: 0 0 auto; align-items: flex-end; gap: 2.5px; height: 16px; }
      .row .eq i { width: 3.5px; background: var(--gold); border-radius: 2px; height: 6px; }
      .row.current {
        background: var(--gold-dim);
        border-color: var(--gold);
      }
      .row.current .num { background: var(--gold); border-color: var(--gold); color: #1a1405; }
      .row.current .title { color: var(--gold-soft); }
      .row.current .eq { display: flex; }
      .row.playing .eq i { animation: eq 0.9s ease-in-out infinite; }
      .row.playing .eq i:nth-child(2) { animation-delay: .25s; }
      .row.playing .eq i:nth-child(3) { animation-delay: .5s; }
      @keyframes eq {
        0%, 100% { height: 5px; }
        50% { height: 16px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .row.playing .eq i { animation: none; height: 12px; }
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 42px 16px;
        font-size: 16px;
      }

      /* ---------- Player bar ---------- */
      .player {
        flex: 0 0 auto;
        background: #0a1830;
        border-top: 1px solid var(--gold);
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
        box-shadow: 0 -8px 30px rgba(0,0,0,.45);
      }
      .player .inner { max-width: 760px; margin: 0 auto; }
      .now-title {
        font-size: 15.5px;
        font-weight: 700;
        color: var(--gold-soft);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 6px;
        min-height: 24px;
      }
      .now-title.idle { color: var(--muted); font-weight: 600; }
      .seek-row {
        display: flex;
        align-items: center;
        gap: 10px;
        direction: ltr;
      }
      .seek-row .time {
        font-size: 12.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        min-width: 38px;
        text-align: center;
      }
      #seek {
        flex: 1;
        -webkit-appearance: none;
        appearance: none;
        height: 32px;
        border: none;
        background: transparent;
        outline: none;
        cursor: pointer;
      }
      #seek::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px; height: 18px;
        border-radius: 50%;
        background: var(--gold);
        border: 2px solid #0a1830;
        box-shadow: 0 0 0 1px var(--gold);
      }
      #seek::-moz-range-thumb {
        width: 16px; height: 16px;
        border-radius: 50%;
        background: var(--gold);
        border: 2px solid #0a1830;
      }
      .btns {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin-top: 2px;
      }
      .ctl {
        border: none;
        background: transparent;
        color: var(--text);
        width: 48px; height: 48px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
      }
      .ctl svg { width: 26px; height: 26px; fill: currentColor; }
      .ctl:active { background: rgba(255,255,255,.08); }
      .ctl:disabled { opacity: .35; cursor: default; }
      #playBtn {
        width: 58px; height: 58px;
        background: var(--gold);
        color: #1a1405;
        box-shadow: 0 4px 18px rgba(212,175,55,.4);
      }
      #playBtn svg { width: 28px; height: 28px; }
      #playBtn:active { background: var(--gold-soft); }
      svg.icon-off { display: none !important; }
    </style>
  </head>

        <div class="clock-ring" id="clockRing" aria-hidden="true"></div>

    <div class="controls">
      <div class="wrap">
        <div class="tabs" role="tablist" aria-label="المجموعات">

        <p class="result-line" id="resultLine"></p>
      </div>
    </div>

    <main>
      <div class="wrap">
        <div class="list" id="list"></div>
        <div class="empty" id="empty" hidden>لا توجد حكايات مطابقة لبحثك</div>

    </main>

    <div class="player">
      <div class="inner">
        <div class="now-title idle" id="nowTitle">اختر حكاية للاستماع</div>

        <div class="btns">

          </button>
          <button class="ctl" id="playBtn" aria-label="تشغيل أو إيقاف مؤقت">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5.5v13c0 .8.9 1.3 1.6.9l10-6.5c.6-.4.6-1.4 0-1.8l-10-6.5C8.9 4.2 8 4.7 8 5.5z"/></svg>

          </button>
        </div>
      </div>
    </div>

      var BASE = {

        2: "https://archive.org/download/abdelaziz-el-3erou/"
      };

      var audio = document.getElementById("audio");
      var listEl = document.getElementById("list");
      var emptyEl = document.getElementById("empty");
      var resultLine = document.getElementById("resultLine");
      var searchEl = document.getElementById("search");
      var nowTitle = document.getElementById("nowTitle");
      var seekEl = document.getElementById("seek");
      var elapsedEl = document.getElementById("elapsed");
      var totalEl = document.getElementById("total");
      var playBtn = document.getElementById("playBtn");
      var playIcon = document.getElementById("playIcon");
      var pauseIcon = document.getElementById("pauseIcon");
      var prevBtn = document.getElementById("prevBtn");
      var nextBtn = document.getElementById("nextBtn");
      var tabBtns = { 1: document.getElementById("tab1"), 2: document.getElementById("tab2") };

      // ---- Live clock in the header ----
      var clockTimeEl = document.getElementById("clockTime");
      var clockSecEl = document.getElementById("clockSec");
      function pad2(n) { return (n < 10 ? "0" : "") + n; }
      function tickClock() {
        var d = new Date();
        if (clockTimeEl) clockTimeEl.textContent = pad2(d.getHours()) + ":" + pad2(d.getMinutes());

      function fmt(sec) {

      function urlOf(tale) { return BASE[tale.c] + encodeURIComponent(tale.f); }

      function render() {
        var q = searchEl.value.trim();
        var items = cols[tab];
        listEl.innerHTML = "";
        var shown = 0;
        items.forEach(function (tale, i) {
          if (q && tale.t.indexOf(q) === -1) return;
          shown++;

          btn.className = "row" + (current && current.c === tab && current.i === i ? " current" : "");
          btn.setAttribute("data-i", i);

            '<span class="num">' + (i + 1) + "</span>" +

      function markPlaying() {

      function loadTale(c, i, autoplay, startAt) {

        nowTitle.textContent = tale.t;
        nowTitle.classList.remove("idle");

        seekEl.value = 0;

      function play(c, i, autoplay) { loadTale(c, i, autoplay, 0); }

      function step(d) {
        if (!current) { play(tab, 0, true); return; }
        var n = current.i + d;
        if (n < 0 || n >= cols[current.c].length) return;
        loadTale(current.c, n, true, 0);
        scrollToCurrent();
      }

      function scrollToCurrent() {
        var el = listEl.querySelector('.row[data-i="' + current.i + '"]');
        if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }

      function paintSeek() {
        var max = parseFloat(seekEl.max) || 0;
        var v = parseFloat(seekEl.value) || 0;
        var pct = max > 0 ? (v / max) * 100 : 0;
        seekEl.style.backgroundImage =
          "linear-gradient(to right, #d4af37 " + pct + "%, #1e3a5f " + pct + "%)";
        seekEl.style.backgroundSize = "100% 6px";
        seekEl.style.backgroundRepeat = "no-repeat";
        seekEl.style.backgroundPosition = "center";
      }

      function saveState(pos) {
        if (!current) return;
        try {
          localStorage.setItem(LS_KEY, JSON.stringify({
            c: current.c,
            i: current.i,
            pos: typeof pos === "number" ? pos : audio.currentTime || 0
          }));
        } catch (e) {}
      }

      function syncTabs() {
        [1, 2].forEach(function (n) {
          var active = tab === n;
          tabBtns[n].classList.toggle("active", active);
          tabBtns[n].setAttribute("aria-selected", active ? "true" : "false");
        });
      }

      tabBtns[1].addEventListener("click", function () { tab = 1; syncTabs(); render(); });
      tabBtns[2].addEventListener("click", function () { tab = 2; syncTabs(); render(); });
      searchEl.addEventListener("input", render);

      playBtn.addEventListener("click", function () {
        if (!current) { play(tab, 0, true); return; }
        if (audio.paused) {
          var p = audio.play();
          if (p && p.catch) p.catch(function () {});
        } else {
          audio.pause();
        }
      });
      prevBtn.addEventListener("click", function () { step(-1); });
      nextBtn.addEventListener("click", function () { step(1); });

      seekEl.addEventListener("input", function () {
        seeking = true;
        elapsedEl.textContent = fmt(parseFloat(seekEl.value));
        paintSeek();
      });
      seekEl.addEventListener("change", function () {
        seeking = false;
        if (current) {
          try { audio.currentTime = parseFloat(seekEl.value); } catch (e) {}

      audio.addEventListener("timeupdate", function () {
        if (!seeking) {
          seekEl.value = audio.currentTime;

        if (now - lastSave > 4000) { lastSave = now; saveState(); }

      audio.addEventListener("play", setPlayIcon);
      audio.addEventListener("pause", function () { setPlayIcon(); saveState(); });
      audio.addEventListener("ended", function () {
        setPlayIcon();

        }

      // ---- Audio-reactive halo ----
      // Lazily route the audio element through an AnalyserNode, once only.
      // Any failure leaves normal direct playback untouched and switches the
      // halo to a gentle CSS pulse instead.
      function ensureGraph() {
        if (graphTried) {
          if (actx && actx.state === "suspended") { var r = actx.resume(); if (r && r.catch) r.catch(function () {}); }
          return;
        }
        graphTried = true;
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) throw new Error("AudioContext unavailable");
          actx = new AC();
          srcNode = actx.createMediaElementSource(audio);
          analyser = actx.createAnalyser();
          analyser.fftSize = 256;
          analyser.smoothingTimeConstant = 0.55;
          srcNode.connect(analyser);
          analyser.connect(actx.destination);
          freqData = new Uint8Array(analyser.frequencyBinCount);
          graphOK = true;
        } catch (e) {
          actx = null; srcNode = null; analyser = null; freqData = null;
          graphOK = false;
          fallbackPulse = true;
        }
        if (actx && actx.state === "suspended") { var p = actx.resume(); if (p && p.catch) p.catch(function () {}); }
      }

      function enableFallbackPulse() {
        if (fallbackPulse) return;
        fallbackPulse = true;
        // Bypass the analyser chain so playback is a plain direct path again.
        try {
          if (srcNode && actx) { srcNode.disconnect(); srcNode.connect(actx.destination); }
        } catch (e) {}
      }

      function haloTick() {
        haloRaf = requestAnimationFrame(haloTick);
        var playing = !audio.paused && !audio.ended && !!current;
        if (reducedMotion) {
          haloEl.classList.remove("css-pulse");
          haloEl.style.opacity = playing ? "0.42" : "0.3";
          return;
        }
        if (fallbackPulse) {
          // CSS animation drives the halo; just toggle it with play state.
          haloEl.style.transform = "";
          haloEl.style.opacity = "";
          haloEl.classList.toggle("css-pulse", playing);
          return;
        }
        haloEl.classList.remove("css-pulse");
        var target = 0;
        if (playing && graphOK && analyser && freqData) {
          analyser.getByteFrequencyData(freqData);
          var bass = 0, total = 0, i;
          for (i = 1; i <= 7 && i < freqData.length; i++) bass += freqData[i];
          bass /= 7;
          for (i = 0; i < freqData.length; i++) total += freqData[i];
          if (total === 0) {
            zeroFrames++;
            // Sustained silence from the analyser while audio plays means the
            // source is tainted: fall back to the CSS pulse, keep playing.
            if (zeroFrames > 90) enableFallbackPulse();
          } else {
            zeroFrames = 0;
            target = Math.min(1, (bass / 255) * 1.35);

        // Fast attack on beats, slower release so the halo breathes.
        var rate = target > haloLevel ? 0.45 : 0.10;
        haloLevel += (target - haloLevel) * rate;
        if (haloLevel < 0.001 && target === 0) haloLevel = 0;
        var scale = 0.78 + haloLevel * 0.5;
        var opacity = 0.3 + haloLevel * 0.7;
        haloEl.style.transform = "translate(-50%, -50%) scale(" + scale.toFixed(3) + ")";
        haloEl.style.opacity = opacity.toFixed(3);
        if (ringEl) ringEl.style.filter = "brightness(" + (1 + haloLevel * 0.8).toFixed(2) + ")";
      }

      function startHaloLoop() {
        if (haloRaf === null) haloRaf = requestAnimationFrame(haloTick);
      }

      audio.addEventListener("play", function () { ensureGraph(); startHaloLoop(); });
      startHaloLoop();

      // Restore last played tale, paused at the saved position.
      (function restore() {
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e) {}
        if (saved && cols[saved.c] && cols[saved.c][saved.i]) {
          tab = saved.c;
          syncTabs();
          loadTale(saved.c, saved.i, false, saved.pos || 0);
          setTimeout(scrollToCurrent, 60);
        } else {
          render();
          paintSeek();
        }
      })();
